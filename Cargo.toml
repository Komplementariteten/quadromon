[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.0"
repository = ""

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
regex = "1.12.2"
serde_json = "1.0"
vello = "0.7.0"
winit = "0.30.12"
pollster = "0.4.0"
anyhow = "1.0.101"
glob = "0.3.3"
dirs = "6.0.0"
postcard = { version = "1.1.3", features = ["alloc"] }
skrifa = "0.40.0"

[workspace]
resolver = "3"
members = ["quadromon", "examples/text", "fluxo", "quadrosrv"]
